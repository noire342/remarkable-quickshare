name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache-dependency-path: kindshare/go.sum
      - name: Go tests
        working-directory: kindshare
        run: go test ./...
      - name: Go vet
        working-directory: kindshare
        run: go vet ./...
      - name: Verify dependency notices
        run: python scripts/collect_licenses.py --check
      - name: Test installers and packaging
        run: python -m unittest discover -s tests -v
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'install.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
      - name: Shell syntax
        if: runner.os == 'Linux'
        run: sh -n install.sh && sh -n device/install-device.sh && sh -n device/uninstall.sh && sh -n device/launch-xochitl.sh
  arm-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache-dependency-path: kindshare/go.sum
      - name: Build redistributable bundle
        run: python scripts/build_release.py --version v0.0.0-ci
      - name: Check packaged notices and payload integrity
        run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: armv7-bundle
          path: |
            release/remarkable-quickshare-linux-armv7.tar.gz
            release/SHA256SUMS
            release/install.ps1
            release/install.sh
  qml-patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the pinned QMLDiff validation tool
        run: |
          git clone https://github.com/asivery/qmldiff.git "$RUNNER_TEMP/qmldiff"
          git -C "$RUNNER_TEMP/qmldiff" checkout a38cccc4e0de99c0fc7f8cb8bf963a1c234267b1
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 build --locked --manifest-path "$RUNNER_TEMP/qmldiff/Cargo.toml" --bin qmldiff
      - name: Validate our QML patch on synthetic resources
        env:
          QMLDIFF_BIN: ${{ runner.temp }}/qmldiff/target/debug/qmldiff
        run: python -m unittest discover -s tests -p test_ui.py -v
