name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag to build
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache-dependency-path: kindshare/go.sum
      - name: Tests and redistributable bundle
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: python scripts/build_release.py --version "$RELEASE_VERSION"
      - name: Installer and packaging tests
        run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: |
            release/remarkable-quickshare-linux-armv7.tar.gz
            release/SHA256SUMS
            release/install.ps1
            release/install.sh
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: release
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release download "$RELEASE_VERSION" --dir published --pattern remarkable-quickshare-linux-armv7.tar.gz --pattern SHA256SUMS --pattern install.ps1 --pattern install.sh
            python scripts/verify_published_release.py release published
            exit 0
          fi
          gh release create "$RELEASE_VERSION" release/* --verify-tag --title "reMarkable Quick Share $RELEASE_VERSION" --notes 'Receiver and easy SSH installers for reMarkable 2, validated firmware 3.27.3.0 only. PDF/EPUB native import, persistent queue, rollback and uninstall. MIT project code with third-party notices included. No reMarkable firmware binary is distributed. Automatic acceptance requires a trusted Wi-Fi network; the tablet must be awake.'
